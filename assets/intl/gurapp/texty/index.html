<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>TEXTY - Text Editor</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,700,1,0" />
    <link rel="stylesheet" href="/assets/gurapp/intl/settings/settings.css">
    <script src="/assets/gurapp/api/gurasuraisu-api.js" defer></script>
    <script src="/assets/intl/gurapp/internal-app-api.js" defer></script>
</head>
<body data-app-name="TEXTY">
    <div class="container" style="max-width: 820px; width: 100%; margin: 0 auto; height: 100vh; display: flex; flex-direction: column;">
        <div class="header">
            <h1 class="page-title">
                <span class="material-symbols-rounded" style="color: #4caf50;">edit_note</span>
                TEXTY
            </h1>
        </div>

        <!-- Editor Toolbar -->
        <div class="setting-section" style="margin-bottom: 8px;">
            <div style="display: flex; justify-content: space-between; align-items: center; width: 100%;">
                <div style="display: flex; gap: 8px; align-items: center;">
                    <input type="text" id="doc-filename" class="form-input" value="untitled.txt" style="width: 140px; padding: 4px 8px; font-size: 12px; font-weight: 600;">
                    <span id="doc-stats" style="font-size: 11px; opacity: 0.7; font-family: monospace;">0 words | 0 chars</span>
                </div>
                <div style="display: flex; gap: 6px;">
                    <button class="action-btn" id="btn-new-doc">New</button>
                    <button class="action-btn" id="btn-open-file">Open</button>
                    <button class="action-btn" id="btn-save-doc" style="background:#4caf50; color:#fff; border:none;">Save</button>
                </div>
            </div>
        </div>

        <!-- Textarea Editor Area -->
        <div class="setting-section" style="flex: 1; display: flex; flex-direction: column; padding: 0; overflow: hidden; border-radius: 16px;">
            <textarea id="texty-editor" style="width: 100%; height: 100%; min-height: 400px; background: transparent; color: var(--text-color); border: none; outline: none; padding: 16px; font-family: 'JetBrains Mono', monospace; font-size: 13px; line-height: 1.6; resize: none; box-sizing: border-box;" placeholder="Type or paste your text or code here..."></textarea>
        </div>
        <input type="file" id="file-picker" style="display: none;">
    </div>

    <script>
        const editor = document.getElementById('texty-editor');
        const filenameInput = document.getElementById('doc-filename');
        const statsEl = document.getElementById('doc-stats');
        const filePicker = document.getElementById('file-picker');

        // Restore draft
        const draft = localStorage.getItem('texty_draft') || '';
        editor.value = draft;
        updateStats();

        function updateStats() {
            const txt = editor.value;
            const words = txt.trim() ? txt.trim().split(/\s+/).length : 0;
            const chars = txt.length;
            statsEl.textContent = `${words} words | ${chars} chars`;
            localStorage.setItem('texty_draft', txt);
        }

        editor.addEventListener('input', updateStats);

        document.getElementById('btn-new-doc').onclick = () => {
            if (editor.value.trim() && !confirm("Discard current document?")) return;
            editor.value = '';
            filenameInput.value = 'untitled.txt';
            updateStats();
        };

        document.getElementById('btn-open-file').onclick = () => {
            filePicker.click();
        };

        filePicker.onchange = (e) => {
            const file = e.target.files[0];
            if (!file) return;
            filenameInput.value = file.name;
            const reader = new FileReader();
            reader.onload = (ev) => {
                editor.value = ev.target.result;
                updateStats();
            };
            reader.readAsText(file);
        };

        document.getElementById('btn-save-doc').onclick = () => {
            const content = editor.value;
            const name = filenameInput.value.trim() || 'document.txt';

            if (window.Gurasuraisu && Gurasuraisu.downloadFile) {
                const blob = new Blob([content], { type: 'text/plain' });
                Gurasuraisu.downloadFile(name, URL.createObjectURL(blob));
            } else {
                const blob = new Blob([content], { type: 'text/plain' });
                const a = document.createElement('a');
                a.href = URL.createObjectURL(blob);
                a.download = name;
                a.click();
            }

            if (window.Gurasuraisu && Gurasuraisu.showPopup) {
                Gurasuraisu.showPopup(`Saved ${name}`);
            }
        };
    </script>
</body>
</html>
