<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="/assets/gurapp/api/gurasuraisu-api.js"></script>
    <style>
        body {
            background: var(--modal-background);
            color: var(--text-color);
            font-family: 'Open Runde', sans-serif;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            height: 100vh;
            width: 100vw;
            padding: 60px;
            margin: 0;
            overflow: hidden;
            text-align: center;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            gap: 30px;
            animation: popIn 0.5s cubic-bezier(0.2, 0.8, 0.2, 1);
            align-items: flex-start;
        }

        .icon {
            font-size: 80px;
            color: var(--secondary-text-color);
            margin-left: auto;
        }

        h1 {
            font-size: clamp(2rem, 5vw, 4rem);
            margin: 0;
            font-weight: 700;
            line-height: 1.2;
            letter-spacing: -0.02em;
        }

        .progress-bar {
            width: 100%;
            height: 20px;
            background: var(--glass-border);
            border-radius: 20px;
            overflow: hidden;
            margin-top: 20px;
        }

        .progress-fill {
            height: 100%;
            background: var(--text-color);
            width: 100%;
            border-radius: 20px;
            animation: countdown 30s linear forwards;
        }

        @keyframes popIn {
            from { transform: scale(0.9) translateY(20px); opacity: 0; }
            to { transform: scale(1) translateY(0); opacity: 1; }
        }

        @keyframes countdown {
            from { width: 100%; }
            to { width: 0%; }
        }
    </style>
</head>
<body>
    <span class="material-symbols-rounded icon">campaign</span>
    <h1 id="text-display">Announcement</h1>
    <div class="progress-bar">
        <div class="progress-fill"></div>
    </div>

    <script>
        const params = new URLSearchParams(window.location.search);
        const text = params.get('text') || "Attention";
        const ttsParam = params.get('tts');
        
        document.getElementById('text-display').innerText = text;

        window.addEventListener('GurasuraisuReady', () => {
            let shouldSpeak = false;
            
            // 1. Determine if we should speak
            if (ttsParam === 'true') shouldSpeak = true;
            else if (ttsParam === 'false') shouldSpeak = false;
            else shouldSpeak = !Gurasuraisu.isSilent();

            // 2. Speak via API (Parent Window)
            if (shouldSpeak) {
                // Short delay for visual transition
                setTimeout(() => {
                    Gurasuraisu.speak(text);
                }, 500);
            }

            // 3. Auto Close
            setTimeout(() => {
                Gurasuraisu.close();
            }, 30000);
        });

        document.body.addEventListener('click', () => {
            Gurasuraisu.close();
        });
    </script>
</body>
</html>
