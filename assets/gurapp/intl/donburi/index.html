<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Donburi</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,700,1,0" />
    <script src="/assets/gurapp/api/gurasuraisu-api.js" defer></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/moment.js/2.29.1/moment.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: transparent; /* Parent handles the overlay background */
            color: var(--text-color);
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            user-select: none;
        }

        /* Top Header */
        .header {
            padding: 40px 20px 20px 20px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .greeting-title {
            font-size: 2.5rem;
            font-weight: 700;
            font-family: 'Open Runde', 'Inter', sans-serif;
            letter-spacing: -0.5px;
        }

        /* Tabs */
        .tabs-container {
            display: flex;
            gap: 10px;
            overflow-x: auto;
            padding-bottom: 10px;
            scrollbar-width: none; /* Firefox */
        }

        .tabs-container::-webkit-scrollbar {
            display: none;
        }

        .tab-btn {
            background-color: var(--search-background);
            color: var(--text-color);
            border: 1px solid var(--glass-border);
            border-radius: 35px;
            corner-shape: superellipse(1.5);
            padding: 12px 20px;
            font-weight: 500;
            font-size: 1rem;
            white-space: nowrap;
            cursor: pointer;
            backdrop-filter: var(--edge-refraction-filter) saturate(2) blur(2.5px);
            box-shadow: var(--sun-shadow);
            transition: all 0.3s cubic-bezier(.3,1.2,.64,1);
        }

        .tab-btn.active {
            background-color: var(--accent);
            color: var(--background-color);
        }

        .tab-btn:active {
            transform: scale(0.95);
            filter: brightness(1.2);
        }

        /* Content Area */
        .content-area {
            flex-grow: 1;
            overflow-y: auto;
            padding: 0 20px 40px 20px;
            scrollbar-width: none;
        }

        .content-area::-webkit-scrollbar {
            display: none;
        }

        /* Bento Grid */
        .bento-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            grid-auto-rows: minmax(100px, auto);
            gap: 15px;
            width: 100%;
            max-width: 800px;
            margin: 0 auto;
        }

        /* Bento Cards */
        .bento-card {
            background-color: var(--search-background);
            border: 1px solid var(--glass-border);
            border-radius: 35px;
            corner-shape: superellipse(1.5);
            backdrop-filter: var(--edge-refraction-filter) saturate(2) blur(5px);
            box-shadow: var(--sun-shadow);
            padding: 20px;
            color: var(--text-color);
            position: relative;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            transition: transform 0.2s cubic-bezier(.3,1.2,.64,1), filter 0.2s;
            cursor: pointer;
        }

        .bento-card:active {
            transform: scale(0.96);
            filter: brightness(1.2);
        }

        .span-1 { grid-column: span 1; }
        .span-2 { grid-column: span 2; }
        .span-3 { grid-column: span 3; }
        .span-4 { grid-column: span 4; }
        .row-1 { grid-row: span 1; }
        .row-2 { grid-row: span 2; }

        /* Specific Card Styles */
        .card-title {
            font-size: 0.9rem;
            color: var(--secondary-text-color);
            margin-bottom: 5px;
            font-weight: 500;
        }

        .card-value {
            font-size: 1.2rem;
            font-weight: 600;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .card-huge-value {
            font-size: 3rem;
            font-weight: 700;
            font-family: 'Open Runde', sans-serif;
            line-height: 1;
        }

        .media-controls {
            display: flex;
            gap: 15px;
            align-items: center;
            justify-content: center;
            margin-top: 15px;
        }

        .icon-btn {
            background: transparent;
            border: none;
            color: inherit;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform 0.2s;
        }

        .icon-btn:active {
            transform: scale(1.2);
        }

        .icon-btn .material-symbols-rounded {
            font-size: 32px;
        }

        /* Controls / Inputs */
        input {
            -webkit-appearance: none;
            width: 100%;
            height: 24px;
            background: rgba(0, 0, 0, 0.2);
            border-radius: 12px;
            outline: none;
            overflow: hidden;
        }

        input::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 24px;
            height: 24px;
            border-radius: 50%;
            background: var(--text-color);
            box-shadow: -100vw 0 0 100vw var(--accent);
            cursor: pointer;
        }

        input {
            appearance: none;
            width: 50px;
            height: 28px;
            background-color: rgba(0, 0, 0, 0.2);
            border-radius: 14px;
            position: relative;
            cursor: pointer;
            transition: background-color 0.3s;
        }

        input:checked {
            background-color: var(--accent);
        }

        input::before {
            content: '';
            position: absolute;
            width: 22px;
            height: 22px;
            background-color: var(--text-color);
            border-radius: 50%;
            top: 3px;
            left: 3px;
            transition: transform 0.3s;
        }

        input:checked::before {
            transform: translateX(22px);
        }

        .list-item {
            display: flex;
            align-items: center;
            gap: 15px;
            padding: 10px 0;
            border-bottom: 1px solid var(--glass-border);
        }

        .list-item:last-child {
            border-bottom: none;
        }
        
        .reduce-animations * {
            transition: none !important;
            animation: none !important;
        }
    </style>
</head>
<body data-app-name="Donburi">

    <div class="header">
        <div class="greeting-title" id="greeting-title">Your morning</div>
        
        <div class="tabs-container" id="tabs">
            <button class="tab-btn active" data-tab="greeting">Overview</button>
            <button class="tab-btn" data-tab="upcoming">Upcoming</button>
            <button class="tab-btn" data-tab="home">Home control</button>
            <button class="tab-btn" data-tab="media">Media</button>
            <button class="tab-btn" data-tab="communicate">Communicate</button>
            <button class="tab-btn" data-tab="around">Around you</button>
            <button class="tab-btn" data-tab="discover">Discover</button>
        </div>
    </div>

    <div class="content-area">
        <div class="bento-grid" id="bento-grid">
            <!-- Grid populated by JS -->
        </div>
    </div>

    <script>
        // --- Core Swipe Logic ---
        let touchStartY = 0;
        document.addEventListener('touchstart', e => {
            touchStartY = e.touches.clientY;
        }, { passive: true });

        document.addEventListener('touchend', e => {
            let touchEndY = e.changedTouches.clientY;
            // Swipe Up threshold
            if (touchStartY - touchEndY > 60) {
                window.parent.postMessage({ type: 'donburi-close' }, '*');
            }
        }, { passive: true });

        // --- Data Loaders (Reading from System) ---
        function getWeatherData() {
            try {
                const data = localStorage.getItem('lastWeatherData');
                if (data) return JSON.parse(data);
            } catch (e) {}
            return null;
        }

        function getWeatherIcon(code) {
            const map = {
                0: 'clear_day', 1: 'partly_cloudy_day', 2: 'partly_cloudy_day', 3: 'cloudy',
                45: 'foggy', 48: 'foggy', 51: 'rainy_light', 53: 'rainy', 55: 'rainy',
                56: 'cloudy_snowing', 57: 'cloudy_snowing', 61: 'rainy_light', 63: 'rainy',
                65: 'rainy', 71: 'cloudy_snowing', 73: 'cloudy_snowing', 75: 'cloudy_snowing',
                80: 'rainy_light', 81: 'rainy', 82: 'thunderstorm', 95: 'thunderstorm'
            };
            return map || 'cloud';
        }

        function getMediaData() {
            try {
                const meta = JSON.parse(localStorage.getItem('lastMediaMetadata'));
                const app = localStorage.getItem('lastMediaSessionApp');
                return { meta, app };
            } catch (e) {}
            return { meta: null, app: null };
        }

        function getEventsData() {
            try {
                return JSON.parse(localStorage.getItem('events') || '[]');
            } catch (e) { return[]; }
        }

        function getTasksData() {
            try {
                return JSON.parse(localStorage.getItem('tasks') || '[]');
            } catch (e) { return[]; }
        }
        
        function getSystemSettings() {
            return {
                brightness: localStorage.getItem('page_brightness') || '100',
                theme: localStorage.getItem('theme') || 'dark',
                silent: localStorage.getItem('silentMode') === 'true',
                minimal: localStorage.getItem('minimalMode') === 'true'
            };
        }

        // --- Interacting with System ---
        function setSetting(key, value) {
            // Using Gurasuraisu API if loaded, or raw postMessage
            if (window.Gurasuraisu && window.Gurasuraisu.setSettingValue) {
                window.Gurasuraisu.setSettingValue(key, value);
            } else {
                window.parent.postMessage({
                    action: 'callGurasuraisuFunc',
                    functionName: 'setSettingValue',
                    args:
                }, '*');
            }
        }

        function controlMedia(action) {
            const mediaApp = localStorage.getItem('lastMediaSessionApp');
            if (mediaApp) {
                if (window.parent && window.parent.Gurasuraisu) {
                    window.parent.Gurasuraisu.callApp(mediaApp, action);
                }
            }
        }

        function launchApp(url) {
            window.parent.postMessage({
                action: 'callGurasuraisuFunc',
                functionName: 'createFullscreenEmbed',
                args:
            }, '*');
            // Close donburi after launching
            window.parent.postMessage({ type: 'donburi-close' }, '*');
        }

        // --- Renderers ---
        const grid = document.getElementById('bento-grid');

        function renderGreetingTab() {
            grid.innerHTML = '';
            
            // 1. Weather (Large)
            const weather = getWeatherData();
            if (weather) {
                const temp = Math.round(weather.current.temperature);
                const unit = weather.temperatureUnit === 'fahrenheit' ? '°F' : '°C';
                const icon = getWeatherIcon(weather.current.weathercode);
                
                grid.innerHTML += `
                    <div class="bento-card span-2 row-2" style="background: var(--accent); color: var(--background-color); justify-content: space-between;" onclick="launchApp('/weather/index.html')">
                        <div class="card-huge-value">${temp}${unit}</div>
                        <div style="display:flex; justify-content:flex-end;">
                            <span class="material-symbols-rounded" style="font-size: 5rem;">${icon}</span>
                        </div>
                        <div style="font-weight: 600; font-size: 1.1rem; margin-top: auto;">${weather.city}</div>
                    </div>
                `;
            }

            // 2. Media (Rectangle)
            const { meta, app } = getMediaData();
            if (meta) {
                const art = meta.artwork?.?.src || '';
                grid.innerHTML += `
                    <div class="bento-card span-2 row-1" style="flex-direction: row; align-items: center; gap: 15px; padding: 15px;" onclick="launchApp('${window.parent?.apps?.?.url || '/music/index.html'}')">
                        ${art ? `<img src="${art}" style="width: 50px; height: 50px; border-radius: 12px; object-fit: cover;">` : `<div style="width: 50px; height: 50px; border-radius: 12px; background: rgba(255,255,255,0.1); display:flex; align-items:center; justify-content:center"><span class="material-symbols-rounded">music_note</span></div>`}
                        <div style="flex-grow: 1; overflow: hidden;">
                            <div class="card-value" style="font-size: 1rem;">${meta.title || 'Unknown'}</div>
                            <div class="card-title" style="margin:0; font-size: 0.8rem;">${meta.artist || ''}</div>
                        </div>
                        <button class="icon-btn" onclick="event.stopPropagation(); controlMedia('playPause')"><span class="material-symbols-rounded">play_arrow</span></button>
                    </div>
                `;
            } else {
                grid.innerHTML += `
                    <div class="bento-card span-2 row-1" style="justify-content: center; align-items: center; opacity: 0.6">
                        <span class="material-symbols-rounded" style="font-size: 2rem;">music_off</span>
                        <div class="card-title" style="margin-top: 5px;">No Media Playing</div>
                    </div>
                `;
            }

            // 3. Upcoming Event (Rectangle)
            const events = getEventsData();
            const now = moment();
            const upcoming = events.filter(e => moment(`${e.date} ${e.startTime||'00:00'}`).isSameOrAfter(now));
            upcoming.sort((a,b) => moment(`${a.date} ${a.startTime||'00:00'}`).diff(moment(`${b.date} ${b.startTime||'00:00'}`)));
            
            if (upcoming.length > 0) {
                const ev = upcoming;
                grid.innerHTML += `
                    <div class="bento-card span-2 row-1" style="justify-content: center;" onclick="launchApp('/fantaskical/index.html')">
                        <div class="card-title">Next Event</div>
                        <div class="card-value" style="font-size: 1.1rem;">${ev.title}</div>
                        <div style="font-size: 0.85rem; color: var(--accent); font-weight: 500;">
                            ${moment(ev.date).format('MMM D')} ${ev.startTime ? 'at ' + ev.startTime : 'All Day'}
                        </div>
                    </div>
                `;
            } else {
                grid.innerHTML += `
                    <div class="bento-card span-2 row-1" style="justify-content: center; align-items: center; opacity: 0.6" onclick="launchApp('/fantaskical/index.html')">
                        <span class="material-symbols-rounded" style="font-size: 2rem;">event_available</span>
                        <div class="card-title" style="margin-top: 5px;">Your day is clear</div>
                    </div>
                `;
            }
        }

        function renderUpcomingTab() {
            grid.innerHTML = '';
            const events = getEventsData();
            const tasks = getTasksData();
            
            grid.innerHTML += `<div class="span-4" style="font-weight: 600; padding: 10px 0 0 10px;">Events</div>`;
            if (events.length === 0) {
                grid.innerHTML += `<div class="bento-card span-4 row-1" style="align-items: center; justify-content: center; opacity: 0.6;">No events</div>`;
            }
            events.slice(0, 4).forEach(ev => {
                grid.innerHTML += `
                    <div class="bento-card span-4 row-1" style="flex-direction: row; align-items: center; justify-content: space-between;" onclick="launchApp('/fantaskical/index.html')">
                        <div>
                            <div class="card-value" style="font-size: 1.1rem;">${ev.title}</div>
                            <div class="card-title" style="margin:0">${moment(ev.date).format('MMM D')} ${ev.startTime ? '- ' + ev.startTime : ''}</div>
                        </div>
                        <span class="material-symbols-rounded" style="color: var(--accent)">event</span>
                    </div>
                `;
            });

            grid.innerHTML += `<div class="span-4" style="font-weight: 600; padding: 10px 0 0 10px; margin-top: 10px;">Active Tasks</div>`;
            const activeTasks = tasks.filter(t => !t.completed);
            if (activeTasks.length === 0) {
                grid.innerHTML += `<div class="bento-card span-4 row-1" style="align-items: center; justify-content: center; opacity: 0.6;">No pending tasks</div>`;
            }
            activeTasks.slice(0, 4).forEach(t => {
                grid.innerHTML += `
                    <div class="bento-card span-4 row-1" style="flex-direction: row; align-items: center; gap: 15px;" onclick="launchApp('/fantaskical/index.html')">
                        <span class="material-symbols-rounded" style="opacity: 0.5">radio_button_unchecked</span>
                        <div class="card-value" style="font-size: 1rem; font-weight: 500;">${t.text}</div>
                    </div>
                `;
            });
        }

        function renderHomeControlTab() {
            grid.innerHTML = '';
            const settings = getSystemSettings();

            // Brightness
            grid.innerHTML += `
                <div class="bento-card span-4 row-1" style="justify-content: center; gap: 10px;">
                    <div class="card-title" style="margin:0">Brightness</div>
                    <div style="display: flex; align-items: center; gap: 15px;">
                        <span class="material-symbols-rounded">light_mode</span>
                        <input type="range" id="db-bright" min="0" max="100" value="${settings.brightness}">
                    </div>
                </div>
            `;

            // Theme Toggle
            grid.innerHTML += `
                <div class="bento-card span-2 row-1" style="justify-content: center; align-items: center; gap: 10px;">
                    <span class="material-symbols-rounded" style="font-size: 2rem;">${settings.theme === 'dark' ? 'dark_mode' : 'light_mode'}</span>
                    <div class="card-title" style="margin:0">Dark Mode</div>
                    <input type="checkbox" id="db-theme" ${settings.theme === 'dark' ? 'checked' : ''}>
                </div>
            `;

            // Silent Toggle
            grid.innerHTML += `
                <div class="bento-card span-2 row-1" style="justify-content: center; align-items: center; gap: 10px;">
                    <span class="material-symbols-rounded" style="font-size: 2rem;">${settings.silent ? 'notifications_off' : 'notifications'}</span>
                    <div class="card-title" style="margin:0">Silent</div>
                    <input type="checkbox" id="db-silent" ${settings.silent ? 'checked' : ''}>
                </div>
            `;

            // Minimal Toggle
            grid.innerHTML += `
                <div class="bento-card span-4 row-1" style="flex-direction: row; justify-content: space-between; align-items: center;">
                    <div style="display: flex; align-items: center; gap: 15px;">
                        <span class="material-symbols-rounded">filter_tilt_shift</span>
                        <div class="card-value" style="font-size: 1.1rem;">Minimal Mode</div>
                    </div>
                    <input type="checkbox" id="db-minimal" ${settings.minimal ? 'checked' : ''}>
                </div>
            `;

            // Attach Listeners
            setTimeout(() => {
                document.getElementById('db-bright').addEventListener('input', e => setSetting('page_brightness', e.target.value));
                document.getElementById('db-theme').addEventListener('change', e => setSetting('theme', e.target.checked ? 'dark' : 'light'));
                document.getElementById('db-silent').addEventListener('change', e => setSetting('silentMode', e.target.checked.toString()));
                document.getElementById('db-minimal').addEventListener('change', e => setSetting('minimalMode', e.target.checked.toString()));
            }, 50);
        }

        function renderMediaTab() {
            grid.innerHTML = '';
            const { meta, app } = getMediaData();

            if (meta) {
                const art = meta.artwork?.?.src || '';
                grid.innerHTML += `
                    <div class="bento-card span-4 row-2" style="align-items: center; justify-content: center; position: relative;">
                        ${art ? `<img src="${art}" style="position:absolute; width:100%; height:100%; object-fit:cover; opacity:0.2; z-index:0; filter:blur(10px)">` : ''}
                        
                        <div style="z-index: 1; display:flex; flex-direction:column; align-items:center; text-align:center; gap: 10px;">
                            ${art ? `<img src="${art}" style="width:120px; height:120px; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.3); object-fit:cover;">` : `<div style="width: 120px; height: 120px; border-radius: 20px; background: rgba(255,255,255,0.1); display:flex; align-items:center; justify-content:center"><span class="material-symbols-rounded" style="font-size: 3rem">music_note</span></div>`}
                            <div class="card-value" style="font-size: 1.3rem; margin-top: 10px;">${meta.title || 'Unknown'}</div>
                            <div class="card-title">${meta.artist || ''}</div>
                            
                            <div class="media-controls">
                                <button class="icon-btn" onclick="controlMedia('prev')"><span class="material-symbols-rounded">skip_previous</span></button>
                                <button class="icon-btn" onclick="controlMedia('playPause')" style="background: var(--text-color); color: var(--background-color); border-radius: 50%; width: 50px; height: 50px;"><span class="material-symbols-rounded">play_arrow</span></button>
                                <button class="icon-btn" onclick="controlMedia('next')"><span class="material-symbols-rounded">skip_next</span></button>
                            </div>
                        </div>
                    </div>
                `;
            } else {
                grid.innerHTML += `
                    <div class="bento-card span-4 row-2" style="align-items: center; justify-content: center; opacity: 0.6">
                        <span class="material-symbols-rounded" style="font-size: 4rem;">music_off</span>
                        <div class="card-value" style="margin-top: 10px;">Nothing Playing</div>
                    </div>
                `;
            }
        }

        function renderCommunicateTab() {
            grid.innerHTML = `
                <div class="bento-card span-4 row-2" style="align-items: center; justify-content: center; opacity: 0.6">
                    <span class="material-symbols-rounded" style="font-size: 3rem;">chat_bubble_outline</span>
                    <div class="card-value" style="margin-top: 15px;">You're all caught up</div>
                    <div class="card-title">No new messages</div>
                </div>
            `;
        }

        function renderAroundYouTab() {
            grid.innerHTML = '';
            const weather = getWeatherData();

            if (weather && weather.dailyForecast) {
                grid.innerHTML += `
                    <div class="bento-card span-4 row-1" style="flex-direction: row; justify-content: space-between; align-items: center;" onclick="launchApp('/weather/index.html')">
                        <div>
                            <div class="card-title">Current Location</div>
                            <div class="card-value" style="font-size: 1.3rem;">${weather.city}</div>
                        </div>
                        <span class="material-symbols-rounded" style="font-size: 2rem; color: var(--accent)">location_on</span>
                    </div>
                `;

                // Render next 3 days
                const daily = weather.dailyForecast;
                for(let i=1; i<=3; i++) {
                    if (daily.time) {
                        const dayName = moment(daily.time).format('dddd');
                        const temp = Math.round(daily.temperature_2m_max);
                        const icon = getWeatherIcon(daily.weathercode);
                        grid.innerHTML += `
                            <div class="bento-card span-4 row-1" style="flex-direction: row; justify-content: space-between; align-items: center; padding: 15px 25px;">
                                <div style="font-weight: 500; width: 100px;">${dayName}</div>
                                <span class="material-symbols-rounded">${icon}</span>
                                <div style="font-weight: 600; width: 50px; text-align: right;">${temp}°</div>
                            </div>
                        `;
                    }
                }
            } else {
                grid.innerHTML += `
                    <div class="bento-card span-4 row-1" style="align-items: center; justify-content: center; opacity: 0.6">
                        Location data unavailable
                    </div>
                `;
            }
        }

        function renderDiscoverTab() {
            grid.innerHTML = '';
            
            try {
                // Try to access parent apps object if same origin
                if (window.parent && window.parent.apps) {
                    const sysApps = window.parent.apps;
                    const appKeys = Object.keys(sysApps).filter(k => k !== 'Apps' && k !== 'Settings');
                    
                    // Shuffle and pick 4
                    const shuffled = appKeys.sort(() => 0.5 - Math.random()).slice(0, 4);

                    shuffled.forEach(appName => {
                        const app = sysApps;
                        let iconSrc = app.icon;
                        if (iconSrc && !iconSrc.startsWith('http') && !iconSrc.startsWith('data:') && !iconSrc.startsWith('/')) {
                            iconSrc = `/assets/appicon/${iconSrc}`;
                        }

                        grid.innerHTML += `
                            <div class="bento-card span-2 row-1" style="align-items: center; justify-content: center; gap: 10px;" onclick="launchApp('${app.url}')">
                                <img src="${iconSrc || '/assets/appicon/system.png'}" style="width: 48px; height: 48px; border-radius: 12px; object-fit: cover;">
                                <div class="card-value" style="font-size: 1rem;">${appName}</div>
                            </div>
                        `;
                    });
                } else {
                    grid.innerHTML += `<div class="bento-card span-4 row-1" style="align-items: center;">App library unavailable</div>`;
                }
            } catch(e) {
                grid.innerHTML += `<div class="bento-card span-4 row-1" style="align-items: center;">App library unavailable</div>`;
            }
        }

        // --- Initialization & Tab Switching ---
        const tabs = document.querySelectorAll('.tab-btn');
        const greetingTitle = document.getElementById('greeting-title');

        function updateGreeting() {
            const hour = new Date().getHours();
            let greeting = "Your evening";
            if (hour >= 5 && hour < 12) greeting = "Your morning";
            else if (hour >= 12 && hour < 17) greeting = "Your afternoon";
            
            greetingTitle.textContent = greeting;
            
            // Also update the button text
            const greetBtn = document.querySelector('');
            if (greetBtn) greetBtn.textContent = 'Overview'; // Keep tab text short
        }

        function switchTab(tabId) {
            tabs.forEach(btn => btn.classList.remove('active'));
            document.querySelector(``).classList.add('active');

            // Add exit animation class to grid
            grid.style.opacity = '0';
            grid.style.transform = 'translateY(10px)';
            
            setTimeout(() => {
                switch(tabId) {
                    case 'greeting': renderGreetingTab(); break;
                    case 'upcoming': renderUpcomingTab(); break;
                    case 'home': renderHomeControlTab(); break;
                    case 'media': renderMediaTab(); break;
                    case 'communicate': renderCommunicateTab(); break;
                    case 'around': renderAroundYouTab(); break;
                    case 'discover': renderDiscoverTab(); break;
                }
                
                // Enter animation
                requestAnimationFrame(() => {
                    grid.style.transition = 'opacity 0.3s, transform 0.3s cubic-bezier(.3,1.2,.64,1)';
                    grid.style.opacity = '1';
                    grid.style.transform = 'translateY(0)';
                });
            }, 150);
        }

        tabs.forEach(btn => {
            btn.addEventListener('click', () => switchTab(btn.dataset.tab));
        });

        // Init
        updateGreeting();
        switchTab('greeting');

        // Periodically update UI elements that might change
        setInterval(() => {
            if (document.querySelector('').classList.contains('active')) {
                // Lightweight refresh without full redraw if possible, or just redraw
                updateGreeting();
            }
        }, 60000);

    </script>
</body>
</html>
