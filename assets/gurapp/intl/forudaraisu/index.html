<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Files only works with Polygol.</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,700,1,0" />
    <script src="/assets/gurapp/api/gurasuraisu-api.js" defer></script>
    <script src="/assets/gurapp/api/shared-file-manager.js" defer></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', sans-serif;
        }
        
        body {
            background-color: var(--background-color-tr);
            min-height: 100vh;
            display: flex;
            user-select: none;
            transition: background-color 0.3s, color 0.3s;
            color: var(--text-color);
            overflow: hidden;
            padding-top: 80px;
        }

        .container {
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
        }
        
        .tab-content {
            display: none;
            flex-grow: 1;
            overflow-y: auto;
            padding: 20px;
        }
        .tab-content.active {
            display: block;
        }

        .section-title {
            font-size: 1.5rem;
            font-weight: 600;
            margin-bottom: 20px;
            font-family: 'Open Runde';
        }

        .action-button {
            background-color: var(--search-background);
            color: var(--text-color);
            border: 1px solid var(--glass-border);
            border-radius: 12px;
            padding: 10px 15px;
            cursor: pointer;
            margin-bottom: 20px;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }
        
        .item-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .file-item {
            display: flex;
            align-items: center;
            gap: 15px;
            padding: 12px;
            background-color: var(--overlay-color);
            border: 1px solid var(--glass-border);
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .file-item:active {
            transform: scale(0.98);
            filter: brightness(1.5);
        }

        .file-icon {
            font-size: 28px;
            color: var(--secondary-text-color);
            width: 40px;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--search-background);
            border-radius: 8px;
        }

        .file-info {
            flex-grow: 1;
            min-width: 0;
        }
        .file-name {
            font-weight: 500;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .file-metadata {
            font-size: 0.85rem;
            color: var(--secondary-text-color);
        }

        .file-actions button {
            background: none;
            border: none;
            color: var(--secondary-text-color);
            cursor: pointer;
            padding: 5px;
        }

        .empty-state {
            text-align: center;
            padding: 50px 20px;
            color: var(--secondary-text-color);
        }
        .empty-state .material-symbols-rounded {
            font-size: 4rem;
        }

        .search-page-container {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }
        .search-bar {
            position: relative;
        }
        .search-input {
            width: 100%;
            padding: 12px 18px 12px 45px;
            border-radius: 25px;
            border: 1px solid var(--glass-border);
            background: var(--search-background);
            color: var(--text-color);
            backdrop-filter: blur(5px) saturate(2) var(--edge-refraction-filter);
            font-size: 1rem;
            outline: none;
        }
        .search-icon {
            font-size: 22px;
            position: absolute;
            left: 15px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--secondary-text-color);
        }

    </style>
</head>
<body data-app-name="Files">
    <div class="container">
        <div class="toolbar">
            <button class="tab-btn active" data-tab="home">
                <span class="material-symbols-rounded">home</span>Home
            </button>
            <button class="tab-btn" data-tab="files">
                <span class="material-symbols-rounded">folder</span>Files
            </button>
            <button class="tab-btn" data-tab="search">
                <span class="material-symbols-rounded">search</span>Search
            </button>
        </div>

        <div id="home-content" class="tab-content active">
            <h2 class="section-title">Home</h2>
            <button id="export-button" class="action-button">
                <span class="material-symbols-rounded">archive</span> Export All Data
            </button>
            <h2 class="section-title">Recent Files</h2>
            <div id="recent-files-list" class="item-list"></div>
        </div>

        <div id="files-content" class="tab-content">
            <h2 class="section-title">All Files</h2>
            <div id="all-files-list" class="item-list"></div>
        </div>

        <div id="search-content" class="tab-content">
             <div class="search-page-container">
                <div class="search-bar">
                     <span class="material-symbols-rounded search-icon">search</span>
                    <input type="text" id="search-input-page" class="search-input" placeholder="Search all files">
                </div>
                <div id="search-results-list" class="item-list"></div>
            </div>
        </div>
    </div>

    <script>
        const DB_NAME = "GurasuraisuSharedFilesDB";
        const DB_VERSION = 1;
        const STORE_NAME = "files";
        let db;

        const tabButtons = document.querySelectorAll('.tab-btn');
        const tabContents = document.querySelectorAll('.tab-content');
        
        const recentFilesList = document.getElementById('recent-files-list');
        const allFilesList = document.getElementById('all-files-list');
        const searchInput = document.getElementById('search-input-page');
        const searchResultsList = document.getElementById('search-results-list');
        const exportButton = document.getElementById('export-button');

        let allFiles = [];

        function initDB() {
            return new Promise((resolve, reject) => {
                const request = indexedDB.open(DB_NAME, DB_VERSION);
                request.onerror = () => reject("Error opening shared files DB.");
                request.onsuccess = () => {
                    db = request.result;
                    resolve();
                };
                request.onupgradeneeded = (event) => {
                    const db = event.target.result;
                    if (!db.objectStoreNames.contains(STORE_NAME)) {
                        const store = db.createObjectStore(STORE_NAME, { keyPath: 'id' });
                        store.createIndex('appName', 'appName', { unique: false });
                        store.createIndex('lastModified', 'lastModified', { unique: false });
                        store.createIndex('fileName', 'fileName', { unique: false });
                    }
                };
            });
        }

        async function loadFiles() {
            if (!db) return;
            const tx = db.transaction(STORE_NAME, 'readonly');
            const store = tx.objectStore(STORE_NAME);
            const index = store.index('lastModified');
            const request = index.getAll();
            
            return new Promise((resolve, reject) => {
                request.onsuccess = () => {
                    allFiles = request.result.reverse();
                    resolve();
                };
                request.onerror = () => reject("Error fetching files.");
            });
        }

        function createFileItemHTML(file) {
             const iconMap = {
                'Music': 'audio_file',
                'Invitations': 'article',
                'Wordy': 'article',
                'Clapper': 'movie',
                'SketchPad': 'draw',
                'Moments': 'image',
                'Camera': 'photo_camera'
            };
            const icon = iconMap[file.appName] || 'draft';

            return `
                <div class="file-item" data-id="${file.id}">
                    <span class="material-symbols-rounded file-icon">${icon}</span>
                    <div class="file-info">
                        <div class="file-name">${file.fileName}</div>
                        <div class="file-metadata">${file.appName} • ${timeAgo(file.lastModified)}</div>
                    </div>
                    <div class="file-actions">
                        <button class="delete-btn" data-id="${file.id}"><span class="material-symbols-rounded">delete</span></button>
                    </div>
                </div>
            `;
        }

        function timeAgo(timestamp) {
            const now = new Date();
            const seconds = Math.floor((now - new Date(timestamp)) / 1000);
            let interval = seconds / 31536000;
            if (interval > 1) return Math.floor(interval) + " years ago";
            interval = seconds / 2592000;
            if (interval > 1) return Math.floor(interval) + " months ago";
            interval = seconds / 86400;
            if (interval > 1) return Math.floor(interval) + " days ago";
            interval = seconds / 3600;
            if (interval > 1) return Math.floor(interval) + " hours ago";
            interval = seconds / 60;
            if (interval > 1) return Math.floor(interval) + " minutes ago";
            return Math.floor(seconds) + " seconds ago";
        }
        
        function renderHomeTab() {
            const recent = allFiles.slice(0, 10);
            if (recent.length === 0) {
                 recentFilesList.innerHTML = `<div class="empty-state"><p>No recent files</p></div>`;
                 return;
            }
            recentFilesList.innerHTML = recent.map(createFileItemHTML).join('');
            attachItemListeners(recentFilesList);
        }

        function renderFilesTab() {
            if (allFiles.length === 0) {
                allFilesList.innerHTML = `
                    <div class="empty-state">
                        <span class="material-symbols-rounded">folder_off</span>
                        <p>No files found</p>
                        <small>Files from your other apps will appear here automatically.</small>
                    </div>`;
                return;
            }
            allFilesList.innerHTML = allFiles.map(createFileItemHTML).join('');
            attachItemListeners(allFilesList);
        }
        
        function renderSearchResults() {
            const query = searchInput.value.toLowerCase();
            if (!query) {
                 searchResultsList.innerHTML = `<div class="empty-state"><p>Start typing to search</p></div>`;
                 return;
            }
            const filtered = allFiles.filter(f => f.fileName.toLowerCase().includes(query) || f.appName.toLowerCase().includes(query));
            if (filtered.length === 0) {
                 searchResultsList.innerHTML = `<div class="empty-state"><p>No results found for "${query}"</p></div>`;
                 return;
            }
            searchResultsList.innerHTML = filtered.map(createFileItemHTML).join('');
            attachItemListeners(searchResultsList);
        }

        function attachItemListeners(container) {
            container.querySelectorAll('.file-item').forEach(item => {
                item.addEventListener('click', (e) => {
                    if (e.target.closest('.delete-btn')) return;
                    const file = allFiles.find(f => f.id === item.dataset.id);
                    if (file) openFile(file);
                });
            });

            container.querySelectorAll('.delete-btn').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    e.stopPropagation();
                    const file = allFiles.find(f => f.id === btn.dataset.id);
                    if (file) deleteFile(file);
                });
            });
        }

        function openFile(file) {
            Gurasuraisu.openApp(file.openUrl);
            setTimeout(() => {
                window.parent.postMessage({
                    targetApp: file.appName,
                    ...file.openParam
                }, window.location.origin);
            }, 500);
        }

        async function deleteFile(file) {
            if (confirm(`Are you sure you want to delete "${file.fileName}"? This cannot be undone.`)) {
                window.parent.postMessage({
                    targetApp: file.appName,
                    type: 'deleteFile',
                    payload: { id: file.originalId }
                }, window.location.origin);
                
                try {
                    const tx = db.transaction(STORE_NAME, 'readwrite');
                    await tx.objectStore(STORE_NAME).delete(file.id);
                    await tx.done;
                    Gurasuraisu.showPopup("File deleted.");
                    await refreshAndRenderAllTabs();
                } catch(e) {
                    Gurasuraisu.showPopup("Error deleting file record.");
                }
            }
        }

        async function exportAllData() {
            if (allFiles.length === 0) {
                Gurasuraisu.showPopup("No files to export.");
                return;
            }
            const exportData = JSON.stringify(allFiles, null, 2);
            const blob = new Blob([exportData], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `gurasuraisu_files_export_${new Date().toISOString().slice(0,10)}.json`;
            a.click();
            URL.revokeObjectURL(url);
        }

        async function refreshAndRenderAllTabs() {
            await loadFiles();
            renderHomeTab();
            renderFilesTab();
            renderSearchResults();
        }

        document.addEventListener('DOMContentLoaded', async () => {
            await initDB();
            await refreshAndRenderAllTabs();

            tabButtons.forEach(button => {
                button.addEventListener('click', () => {
                    tabButtons.forEach(btn => btn.classList.remove('active'));
                    button.classList.add('active');
                    
                    tabContents.forEach(content => content.classList.remove('active'));
                    const tabId = button.dataset.tab + '-content';
                    document.getElementById(tabId).classList.add('active');
                    
                    // Re-render the active tab to ensure it's up to date
                    if(button.dataset.tab === 'home') renderHomeTab();
                    if(button.dataset.tab === 'files') renderFilesTab();
                    if(button.dataset.tab === 'search') renderSearchResults();
                });
            });

            searchInput.addEventListener('input', renderSearchResults);
            exportButton.addEventListener('click', exportAllData);
        });
        
        window.addEventListener('message', (event) => {
            if (event.origin !== window.location.origin) return;
            if (event.data.type === 'fileSystemUpdate') {
                console.log("File system update received. Refreshing...");
                refreshAndRenderAllTabs();
            }
        });
    </script>
</body>
</html>
