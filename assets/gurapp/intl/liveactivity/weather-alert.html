<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <script src="/assets/gurapp/api/gurasuraisu-api.js"></script>
    <style>
        body {
            margin: 0; padding: 16px 20px;
            background: var(--search-background);
            color: var(--text-color);
            font-family: 'Open Runde', sans-serif;
            display: flex; align-items: center; gap: 15px;
            height: 100vh; width: 100vw; box-sizing: border-box;
            overflow: hidden;
        }
        .icon-box {
            width: 48px; height: 48px;
            background: var(--tonal);
            border-radius: 14px;
            display: flex; align-items: center; justify-content: center;
        }
        .content { display: flex; flex-direction: column; gap: 2px; }
        .title { font-weight: 700; font-size: 1.1rem; }
        .desc { opacity: 0.7; font-size: 0.9rem; }
    </style>
</head>
<body>
    <div class="icon-box">
        <span id="icon" class="material-symbols-rounded" style="font-size: 32px;"></span>
    </div>
    <div class="content">
        <div id="title" class="title">Weather</div>
        <div id="desc" class="desc"></div>
    </div>
    <script>
        window.addEventListener('message', (e) => {
            if (e.data.type === 'live-activity-update') {
                if (e.data.icon) document.getElementById('icon').textContent = e.data.icon;
                if (e.data.title) document.getElementById('title').textContent = e.data.title;
                if (e.data.text) document.getElementById('desc').textContent = e.data.text;
            }
        });
    </script>
</body>
</html>
